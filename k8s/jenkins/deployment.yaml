apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: codesync
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      nodeSelector:
        kubernetes.io/hostname: codesync-master
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      containers:
        - name: jenkins
          image: jenkins/jenkins:lts-jdk17
          ports:
            - containerPort: 8080
            - containerPort: 50000
          volumeMounts:
            - name: jenkins-data
              mountPath: /var/jenkins_home
          resources:
            requests:
              memory: 512Mi
              cpu: 300m
            limits:
              memory: 1Gi
              cpu: 600m
      volumes:
        - name: jenkins-data
          persistentVolumeClaim:
            claimName: jenkins-data
