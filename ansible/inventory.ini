# Populate these IPs from Terraform outputs:
#   terraform output master_public_ip
#   terraform output worker1_public_ip
#   terraform output worker2_public_ip

[master]
# Replace MASTER_IP with the value from: terraform output master_public_ip
MASTER_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/your-key.pem

[workers]
# Replace WORKER1_IP with the value from: terraform output worker1_public_ip
WORKER1_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/your-key.pem
# Replace WORKER2_IP with the value from: terraform output worker2_public_ip
WORKER2_IP ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/your-key.pem

[all:children]
master
workers
