# CodeSync environment injection — run on master after cluster is up.
# Run with: ansible-playbook env.yml -i inventory.ini --extra-vars 'ecr_url=... aws_region=... aws_access_key=... aws_secret_key=...'
- name: Inject CodeSync environment variables on master node
  hosts: master
  become: true
  tasks:
    - name: Write /etc/codesync-env with ECR and AWS variables
      copy:
        content: |
          ECR_URL={{ ecr_url }}
          AWS_REGION={{ aws_region }}
          K8S_NAMESPACE=codesync
        dest: /etc/codesync-env
        mode: "0644"

    - name: Source /etc/codesync-env from /etc/environment
      lineinfile:
        path: /etc/environment
        line: ". /etc/codesync-env"
        state: present

    - name: Create /home/ubuntu/.aws directory
      file:
        path: /home/ubuntu/.aws
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0700"

    - name: Write AWS credentials file for ubuntu user
      copy:
        content: |
          [default]
          aws_access_key_id={{ aws_access_key }}
          aws_secret_access_key={{ aws_secret_key }}
        dest: /home/ubuntu/.aws/credentials
        owner: ubuntu
        group: ubuntu
        mode: "0600"
