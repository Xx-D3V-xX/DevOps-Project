services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: codesync
      POSTGRES_PASSWORD: password
      POSTGRES_DB: codesync
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://codesync:password@postgres:5432/codesync
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173
      NODE_ENV: development
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
