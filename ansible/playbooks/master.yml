# CodeSync master init — run AFTER setup.yml
- name: Initialise Kubernetes control plane on master node
  hosts: master
  become: yes
  tasks:
    - name: Run kubeadm init
      command: kubeadm init --pod-network-cidr=10.244.0.0/16
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Create /home/ubuntu/.kube directory
      file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0755"

    - name: Copy admin.conf to /home/ubuntu/.kube/config
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ubuntu/.kube/config
        remote_src: yes
        owner: ubuntu
        group: ubuntu
        mode: "0600"

    - name: Create /root/.kube directory
      file:
        path: /root/.kube
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy admin.conf to /root/.kube/config
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: yes
        owner: root
        group: root
        mode: "0600"

    - name: Apply Flannel CNI
      command: kubectl apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf

    - name: Generate kubeadm join command
      command: kubeadm token create --print-join-command
      register: join_command

    - name: Save join command to /tmp/join-command.sh on master
      copy:
        content: "{{ join_command.stdout }}\n"
        dest: /tmp/join-command.sh
        mode: "0755"

    - name: Fetch join command to Ansible controller
      fetch:
        src: /tmp/join-command.sh
        dest: /tmp/join-command.sh
        flat: yes
